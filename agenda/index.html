<style>
/* ================= TOKENS ================= */
:root{
  --bg:#111418;--bg2:#0B0D10;--card:#181C22;--card2:#1F242C;--ink:#F4F1EA;--mut:#9AA0A8;--line:rgba(255,255,255,.09);--line2:rgba(255,255,255,.16);
  --acc:#FF5B2E;--acc2:#FF8A5C;--accInk:#fff;--accSoft:rgba(255,91,46,.14);--ok:#2FBF71;--err:#FF6B6B;--errbg:rgba(255,107,107,.12);
  --disp:"Sora","Helvetica Neue",Arial,sans-serif;--body:"DM Sans","Helvetica Neue",Arial,sans-serif;--mono:ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:22px;--r2:16px;--sh:0 24px 60px rgba(0,0,0,.35);color-scheme:dark;
}
html[data-brand=s360]{
  --bg:#F3F5FA;--bg2:#E8ECF5;--card:#FFFFFF;--card2:#F6F8FD;--ink:#0E1A33;--mut:#5A6680;--line:#DDE3EF;--line2:#C9D2E4;
  --acc:#2B5FD9;--acc2:#5B85F0;--accInk:#fff;--accSoft:rgba(43,95,217,.09);--ok:#1E8E5A;--err:#C2372F;--errbg:#FBE9E7;
  --disp:"Archivo","Arial Narrow","Helvetica Neue",Arial,sans-serif;--body:"Inter Tight","Inter",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:6px;--r2:4px;--sh:0 18px 50px rgba(14,26,51,.10);color-scheme:light;
}
html[data-brand=isra]{
  --bg:#F7F1EC;--bg2:#EFE6DD;--card:#FFFCF8;--card2:#FBF6F0;--ink:#1B2238;--mut:#6B6A73;--line:#E7DCD0;--line2:#D8C9B7;
  --acc:#1B2238;--acc2:#2C3657;--accInk:#F7F1EC;--accSoft:rgba(27,34,56,.06);--gold:#B8955A;--gold2:#D9BC83;--ok:#2F7A55;--err:#A83A2E;--errbg:#F7E4DF;
  --disp:"Fraunces",Georgia,"Times New Roman",serif;--body:"DM Sans","Helvetica Neue",Arial,sans-serif;
  --r:26px;--r2:18px;--sh:0 24px 60px rgba(27,34,56,.10);color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:15.5px/1.5 var(--body);-webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100vh}
img{display:block;max-width:100%}
a{color:inherit}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--acc2);outline-offset:3px;border-radius:6px}
html[data-brand=isra] :focus-visible{outline-color:var(--gold)}
.wrap{max-width:1180px;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left,0px))}
.tab{font-variant-numeric:tabular-nums}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.s16{width:16px;height:16px}svg.i.s18{width:18px;height:18px}svg.i.s24{width:24px;height:24px}
h1,h2,h3,h4{font-family:var(--disp);line-height:1.04;letter-spacing:-.02em;text-wrap:balance}
.ey{font:700 11px var(--body);letter-spacing:.2em;text-transform:uppercase;color:var(--acc)}
.mut{color:var(--mut)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mono{display:inline-grid;place-items:center;background:var(--acc);color:var(--accInk);font:800 15px var(--disp);letter-spacing:.02em}
span.mono{background:var(--acc)!important;color:var(--accInk)!important;line-height:1;white-space:nowrap;overflow:hidden}
html[data-brand=isra] span.mono{color:var(--gold2)!important;font-weight:500}
html[data-brand=s360] span.mono{font-size:11px;letter-spacing:0}

/* ================= TOP BAR ================= */
.top{position:sticky;top:0;z-index:40;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);background:color-mix(in srgb,var(--bg) 78%,transparent);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;height:62px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;min-width:0}
.brand .lg{width:36px;height:36px;border-radius:11px;object-fit:cover;flex:none;background:var(--card2)}
html[data-brand=isra] .brand .lg,html[data-brand=s360] .brand .lg{border-radius:50%}
.brand .nm{font:700 16px/1.1 var(--disp);letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .nm small{display:block;font:500 11.5px var(--body);letter-spacing:.02em;color:var(--mut);margin-top:2px}
.pill{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:9px 14px;font:600 13px var(--body);text-decoration:none;border:1px solid var(--line2);white-space:nowrap;transition:transform .2s,background .2s}
.pill:hover{transform:translateY(-1px);background:var(--accSoft)}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px color-mix(in srgb,var(--ok) 22%,transparent)}

/* ================= BUTTONS ================= */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:14px 22px;border-radius:999px;font:700 15px var(--body);text-decoration:none;transition:transform .2s,box-shadow .2s,background .2s,opacity .2s;white-space:nowrap}
.btn:hover{transform:translateY(-2px)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn-acc{background:var(--acc);color:var(--accInk);box-shadow:0 14px 30px color-mix(in srgb,var(--acc) 35%,transparent)}
.btn-ghost{border:1px solid var(--line2);background:transparent}
.btn-wa{background:#1FAF5A;color:#fff;box-shadow:0 14px 30px rgba(31,175,90,.3)}
html[data-brand=s360] .btn{border-radius:4px;letter-spacing:.01em}
html[data-brand=isra] .btn-acc{box-shadow:0 14px 30px rgba(27,34,56,.22)}
.btn .arr{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.18);margin-right:-10px}
.lnk{display:inline-flex;align-items:center;gap:6px;font:600 13.5px var(--body);color:var(--mut);padding:8px 2px}
.lnk:hover{color:var(--ink)}

/* ================= HERO (shared bits) ================= */
.hero{position:relative;isolation:isolate;overflow:hidden}
.hero h1 em{font-style:normal;color:var(--acc)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:7px 12px;font:600 12.5px var(--body);border:1px solid var(--line2);background:color-mix(in srgb,var(--card) 60%,transparent);white-space:nowrap}
.chip svg{color:var(--acc)}
.nextfree{display:inline-flex;align-items:center;gap:10px;border-radius:999px;padding:8px 14px 8px 8px;background:var(--card);border:1px solid var(--line);font:600 13px var(--body);box-shadow:0 6px 18px rgba(0,0,0,.08);max-width:100%}
.nextfree b{font-weight:700}
.nextfree .ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--accSoft);color:var(--acc);flex:none}
.nextfree span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- AC hero ---------- */
html[data-brand=ac] .hero{padding:54px 0 34px}
html[data-brand=ac] .hero::before{content:"";position:absolute;inset:-20% -10% auto auto;width:720px;height:720px;z-index:-1;background:radial-gradient(closest-side,rgba(255,91,46,.32),rgba(255,91,46,.08) 55%,transparent 72%);filter:blur(10px)}
html[data-brand=ac] .hero::after{content:"";position:absolute;inset:0;z-index:-2;opacity:.5;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:44px 44px;mask-image:linear-gradient(180deg,#000,transparent 85%);-webkit-mask-image:linear-gradient(180deg,#000,transparent 85%)}
.ac-grid{display:grid;gap:30px;align-items:center}
.ac-h1{font-size:clamp(40px,10.5vw,76px);font-weight:800;letter-spacing:-.045em;line-height:.98}
.ac-h1 em{background:linear-gradient(100deg,#FF5B2E,#FFB36B);-webkit-background-clip:text;background-clip:text;color:transparent!important}
.ac-sub{font-size:17px;color:var(--mut);max-width:520px;margin:18px 0 22px}
.ac-cta{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:22px}
.ac-card{position:relative;border-radius:28px;padding:22px;background:linear-gradient(160deg,#1E232B,#14171C);border:1px solid var(--line2);box-shadow:0 30px 80px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.06);overflow:hidden}
.ac-card::before{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,91,46,.45),transparent)}
.host{display:flex;align-items:center;gap:14px;position:relative}
.host .av{width:58px;height:58px;border-radius:18px;object-fit:cover;flex:none;background:var(--card2)}
.host b{display:block;font:700 17px/1.2 var(--disp)}
.host small{color:var(--mut);font-size:13px}
.ac-kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:18px;position:relative}
.ac-kpis div{border-radius:16px;background:rgba(255,255,255,.04);border:1px solid var(--line);padding:12px 10px}
.ac-kpis b{display:block;font:800 20px var(--disp);letter-spacing:-.03em;color:#fff}
.ac-kpis span{font-size:11.5px;color:var(--mut);line-height:1.25;display:block}
.proof{margin-top:30px}
.proof-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
.proof-h h2{font-size:15px;font-weight:700;letter-spacing:0;font-family:var(--body)}
.proof-h a{font-size:13px;color:var(--mut);text-decoration:none;white-space:nowrap}
.strip{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:8px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.demo{flex:0 0 132px;scroll-snap-align:start;text-decoration:none;border-radius:18px;overflow:hidden;background:var(--card);border:1px solid var(--line);transition:transform .25s,border-color .25s}
.demo:hover{transform:translateY(-3px);border-color:var(--line2)}
.demo .ph{position:relative;aspect-ratio:4/3;background:var(--c,#333)}
.demo .ph img{width:100%;height:100%;object-fit:cover}
.demo .ph::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,.55))}
.demo .ph i{position:absolute;left:8px;bottom:8px;z-index:1;width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 0 3px rgba(255,255,255,.85)}
.demo span{display:flex;justify-content:space-between;align-items:center;padding:9px 11px;font:600 12.5px var(--body)}
.demo span svg{opacity:.5}

/* ---------- S360 hero ---------- */
html[data-brand=s360] body{background-image:linear-gradient(rgba(43,95,217,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(43,95,217,.05) 1px,transparent 1px);background-size:32px 32px}
html[data-brand=s360] .ey{font-family:var(--mono);font-weight:600;letter-spacing:.12em}
html[data-brand=s360] h1,html[data-brand=s360] h2{font-stretch:88%;letter-spacing:-.02em;font-weight:750;text-transform:none}
.s-hero{padding:22px 0 10px}
.mosaic{display:grid;grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr;gap:6px;height:min(68vw,520px);border-radius:6px;overflow:hidden}
.mosaic figure{position:relative;background:#1A2A52;overflow:hidden}
.mosaic figure:first-child{grid-row:1/3}
.mosaic img{width:100%;height:100%;object-fit:cover;transition:transform 1.2s cubic-bezier(.2,.7,.2,1)}
.mosaic figure:hover img{transform:scale(1.04)}
.mosaic figcaption{position:absolute;left:8px;bottom:8px;font:600 10.5px var(--mono);letter-spacing:.06em;color:#fff;background:rgba(14,26,51,.6);backdrop-filter:blur(6px);padding:5px 8px;border-radius:3px;text-transform:uppercase}
.s-head{position:relative;margin:-64px 10px 0;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:22px 20px 20px;box-shadow:var(--sh)}
.s-head::before,.s-head::after{content:"";position:absolute;width:14px;height:14px;border:2px solid var(--acc)}
.s-head::before{left:-1px;top:-1px;border-right:0;border-bottom:0}
.s-head::after{right:-1px;bottom:-1px;border-left:0;border-top:0}
.s-h1{font-size:clamp(36px,9.6vw,68px);line-height:.96;margin:10px 0 12px}
.s-h1 em{color:var(--acc)}
.s-sub{color:var(--mut);font-size:16px;max-width:560px}
.dim{display:none;align-items:center;gap:8px;font:500 11px var(--mono);color:var(--acc);margin-top:16px;letter-spacing:.06em}
.dim::before,.dim::after{content:"";flex:1;height:1px;background:currentColor;opacity:.5}
.dim i{font-style:normal;white-space:nowrap}
.method{margin-top:22px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;border:1px solid var(--line);border-radius:6px;background:var(--card);overflow:hidden}
.method li{list-style:none;padding:14px 10px 13px;border-right:1px solid var(--line);position:relative;min-width:0}
.method li:last-child{border-right:0}
.method li b{display:block;font:600 11px var(--mono);color:var(--acc);margin-bottom:6px}
.method li span{display:block;font:700 13px/1.15 var(--disp);font-stretch:90%}
.method li small{display:block;color:var(--mut);font-size:11.5px;margin-top:3px;line-height:1.25}
.method li.on{background:var(--accSoft)}
.method li.on::after{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--acc)}

/* ---------- ISRA hero ---------- */
html[data-brand=isra] body{background:radial-gradient(900px 500px at 85% -10%,rgba(217,188,131,.25),transparent 60%),var(--bg)}
html[data-brand=isra] .ey{color:var(--gold);letter-spacing:.24em}
html[data-brand=isra] h1,html[data-brand=isra] h2,html[data-brand=isra] h3{font-weight:500;letter-spacing:-.025em}
.i-hero{padding:40px 0 34px}
.i-grid{display:grid;gap:26px;align-items:center}
.portrait{position:relative;width:min(62vw,300px);aspect-ratio:1;margin:0 auto}
.portrait .ring{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 210deg,#F1DDB0,#B8955A,#E9D3A2,#8E6E3A,#F1DDB0);padding:4px}
.portrait .ring::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--bg)}
.portrait img,.portrait .mono{position:absolute;inset:12px;width:calc(100% - 24px);height:calc(100% - 24px);border-radius:50%;object-fit:cover;z-index:1;background:#E5D8C8}
.portrait .mono{background:var(--ink);color:var(--gold2);font:500 64px var(--disp)}
.portrait .badge{position:absolute;z-index:2;right:-4px;bottom:16%;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 13px 8px 9px;font:600 12.5px var(--body);box-shadow:var(--sh);white-space:nowrap}
.portrait .badge i{width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px rgba(47,122,85,.18)}
.i-name{font:500 15px var(--body);color:var(--mut);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.i-name b{font:600 19px var(--disp);color:var(--ink)}
.i-h1{font-size:clamp(42px,11vw,80px);line-height:.98;margin:12px 0 14px}
.i-h1 em{font-style:italic;color:var(--gold)!important;font-weight:400}
.i-sub{color:var(--mut);font-size:17px;max-width:520px}
.creds{display:flex;flex-wrap:wrap;margin:22px 0 4px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.creds div{flex:1 1 33%;padding:14px 12px 14px 0;min-width:0}
.creds div+div{padding-left:14px;border-left:1px solid var(--line)}
.creds b{display:block;font:500 clamp(20px,5.4vw,26px)/1 var(--disp);letter-spacing:-.03em}
.creds span{display:block;font-size:12px;color:var(--mut);margin-top:5px;line-height:1.3}
.quote{font:italic 400 18px/1.4 var(--disp);color:var(--ink);margin-top:18px;padding-left:16px;border-left:2px solid var(--gold)}

/* ================= BOOKING ================= */
.book{padding:30px 0 20px;scroll-margin-top:70px}
.bk-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.bk-head h2{font-size:clamp(28px,6.6vw,40px)}
.bk-grid{display:grid;gap:18px;align-items:start}
.flow{scroll-margin-top:78px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;min-width:0}
html[data-brand=ac] .flow{background:linear-gradient(180deg,#191D24,#15181D)}
.flow.fin{background:none!important;border:0;box-shadow:none;overflow:visible}
.flow.fin .stage{padding:0}
.bk-grid.fin{grid-template-columns:minmax(0,1fr)!important}
.stepper{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-bottom:1px solid var(--line)}
.stepper button{display:flex;align-items:center;gap:9px;padding:15px 12px;font:600 13px var(--body);color:var(--mut);text-align:left;position:relative;min-width:0}
.stepper button span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stepper button:disabled{cursor:default}
.stepper .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line2);font:700 12px var(--body);flex:none;transition:all .3s}
html[data-brand=s360] .stepper .n{border-radius:3px;font-family:var(--mono)}
.stepper button[aria-current=step]{color:var(--ink)}
.stepper button[aria-current=step] .n{background:var(--acc);border-color:var(--acc);color:var(--accInk)}
.stepper button.done{color:var(--ink)}
.stepper button.done .n{background:var(--accSoft);border-color:transparent;color:var(--acc)}
.stepper button::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--acc);transform:scaleX(0);transform-origin:left;transition:transform .35s}
.stepper button[aria-current=step]::after{transform:scaleX(1)}
.stage{padding:20px 18px 22px;min-height:340px}
.st-t{font:700 20px/1.2 var(--disp);margin-bottom:4px}
html[data-brand=isra] .st-t{font-weight:500;font-size:23px}
.st-s{color:var(--mut);font-size:14px;margin-bottom:16px}
.fade{animation:fade .45s cubic-bezier(.2,.7,.2,1)}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* service cards */
.svcs{display:grid;gap:10px}
.svc{display:flex;align-items:flex-start;gap:14px;width:100%;text-align:left;padding:16px;border-radius:var(--r2);border:1.5px solid var(--line);background:var(--card2);transition:transform .2s,border-color .2s,box-shadow .2s;position:relative;min-width:0}
.svc:hover{transform:translateY(-2px);border-color:var(--line2);box-shadow:0 12px 26px rgba(0,0,0,.12)}
.svc[aria-pressed=true]{border-color:var(--acc);box-shadow:0 0 0 4px var(--accSoft)}
.svc .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--accSoft);color:var(--acc);flex:none}
html[data-brand=s360] .svc .ic{border-radius:4px;font:600 13px var(--mono)}
html[data-brand=isra] .svc .ic{border-radius:50%;background:transparent;border:1px solid var(--gold2);color:var(--gold)}
.svc .tx{min-width:0;flex:1}
.svc b{display:block;font:700 16px/1.25 var(--disp);margin-bottom:4px}
html[data-brand=isra] .svc b{font-weight:500;font-size:18px}
.svc p{color:var(--mut);font-size:13.5px;line-height:1.45}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tag{display:inline-flex;align-items:center;gap:5px;font:600 11.5px var(--body);padding:4px 9px;border-radius:999px;background:var(--bg2);color:var(--ink)}
html[data-brand=ac] .tag{background:rgba(255,255,255,.06)}
.tag.free{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.svc .go{align-self:center;color:var(--mut);transition:transform .2s}
.svc:hover .go{transform:translateX(3px);color:var(--acc)}

/* selection recap */
.recap{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--bg2);margin-bottom:16px;font-size:13.5px;min-width:0}
html[data-brand=ac] .recap{background:rgba(255,255,255,.05)}
.recap .tx{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.recap b{font-weight:700}
.recap button{font:600 13px var(--body);color:var(--acc);white-space:nowrap}

/* days */
.days{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x proximity;padding:2px 2px 10px;margin:0 -2px;scrollbar-width:thin}
.day{flex:0 0 62px;scroll-snap-align:start;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px 9px;border-radius:16px;border:1.5px solid var(--line);background:var(--card2);transition:all .2s;position:relative}
html[data-brand=s360] .day{border-radius:4px}
.day .w{font:600 11px var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--mut)}
.day .d{font:700 22px/1.1 var(--disp);font-variant-numeric:tabular-nums}
html[data-brand=isra] .day .d{font-weight:500}
.day .m{font:500 10.5px var(--body);color:var(--mut)}
.day .c{position:absolute;top:6px;right:7px;width:6px;height:6px;border-radius:50%;background:var(--ok)}
.day:hover:not(:disabled){border-color:var(--line2);transform:translateY(-2px)}
.day[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:var(--accInk)}
.day[aria-pressed=true] .w,.day[aria-pressed=true] .m{color:inherit;opacity:.85}
.day[aria-pressed=true] .c{background:#fff}
.day:disabled{opacity:.38;cursor:not-allowed;background:transparent;border-style:dashed}
.day:disabled .m{font-size:10px}
.slots-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:14px 0 10px}
.slots-h b{font:700 15px var(--disp)}
html[data-brand=isra] .slots-h b{font-weight:500;font-size:18px}
.slots-h small{font-size:12px;color:var(--mut);white-space:nowrap}
.grp{margin-bottom:12px}
.grp>span{display:block;font:700 11px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin-bottom:8px}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.slot{padding:12px 6px;border-radius:12px;border:1.5px solid var(--line);background:var(--card2);font:700 14px var(--body);font-variant-numeric:tabular-nums;transition:all .18s;white-space:nowrap}
html[data-brand=s360] .slot{border-radius:3px;font-family:var(--mono);font-weight:600;font-size:13px}
.slot:hover{border-color:var(--acc);color:var(--acc)}
.slot[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:var(--accInk);box-shadow:0 10px 22px color-mix(in srgb,var(--acc) 30%,transparent)}
.empty{text-align:center;padding:30px 12px;color:var(--mut);border:1.5px dashed var(--line2);border-radius:var(--r2)}
.empty b{display:block;color:var(--ink);font:700 16px var(--disp);margin-bottom:4px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:18px;padding-top:16px;border-top:1px solid var(--line);flex-wrap:wrap}
.bar .btn{flex:1 1 220px}
.note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;font-size:13.5px;margin-bottom:14px;line-height:1.4}
.note.err{background:var(--errbg);color:var(--err)}
.note.info{background:var(--accSoft);color:var(--ink)}
.note svg{flex:none;margin-top:1px}

/* form */
.fgrid{display:grid;gap:14px}
.fld label{display:block;font:600 13px var(--body);margin-bottom:6px}
.fld label small{font-weight:500;color:var(--mut)}
.inp{width:100%;min-height:50px;padding:13px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--card2);font-size:16px;transition:border-color .2s,box-shadow .2s}
html[data-brand=s360] .inp{border-radius:4px}
.inp:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 4px var(--accSoft)}
.inp[aria-invalid=true]{border-color:var(--err)}
textarea.inp{min-height:92px;resize:vertical}
.tel{display:flex;align-items:stretch}
.tel span{display:flex;align-items:center;padding:0 12px;border:1.5px solid var(--line);border-right:0;border-radius:14px 0 0 14px;background:var(--bg2);font:600 14px var(--body);color:var(--mut)}
html[data-brand=s360] .tel span{border-radius:4px 0 0 4px}
html[data-brand=ac] .tel span{background:rgba(255,255,255,.04)}
.tel .inp{border-radius:0 14px 14px 0}
html[data-brand=s360] .tel .inp{border-radius:0 4px 4px 0}
.ferr{display:none;color:var(--err);font-size:12.5px;margin-top:5px}
.fld.bad .ferr{display:block}
.brief{border:1px solid var(--line);border-radius:var(--r2);padding:14px;background:var(--card2)}
.brief>b{display:flex;align-items:center;gap:8px;font:700 14px var(--disp);margin-bottom:2px}
html[data-brand=isra] .brief>b{font-weight:500;font-size:17px}
.brief>p{font-size:12.5px;color:var(--mut);margin-bottom:10px}
.q{margin-top:10px}
.q>span{display:block;font:600 12.5px var(--body);margin-bottom:7px;color:var(--mut)}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{padding:8px 12px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);font:600 13px var(--body);transition:all .15s}
html[data-brand=s360] .opt{border-radius:3px}
.opt:hover{border-color:var(--line2)}
.opt[aria-pressed=true]{border-color:var(--acc);background:var(--accSoft);color:var(--acc)}
html[data-brand=ac] .opt[aria-pressed=true]{color:#FF8A5C}
.legal{font-size:12px;color:var(--mut);margin-top:12px;line-height:1.45}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid currentColor;border-right-color:transparent;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* summary aside */
.sum{display:none;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--sh);position:sticky;top:80px}
html[data-brand=ac] .sum{background:linear-gradient(180deg,#191D24,#15181D)}
.sum .host{padding-bottom:16px;border-bottom:1px solid var(--line);margin-bottom:14px}
html[data-brand=isra] .sum .host .av{border-radius:50%;box-shadow:0 0 0 2px #fff,0 0 0 4px var(--gold2)}
html[data-brand=s360] .sum .host .av{border-radius:6px}
.sum dl{display:grid;gap:12px}
.sum dt{font:700 10.5px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.sum dd{font:600 14.5px var(--body);margin-top:2px}
.sum dd.ph{color:var(--mut);font-weight:500}
.sum .perks{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);display:grid;gap:8px;font-size:13px;color:var(--mut)}
.sum .perks div{display:flex;gap:8px;align-items:center}
.sum .perks svg{color:var(--acc)}
html[data-brand=isra] .sum .perks svg{color:var(--gold)}

/* skeleton */
.sk{border-radius:14px;background:linear-gradient(90deg,var(--card2),color-mix(in srgb,var(--line2) 60%,var(--card2)),var(--card2));background-size:200% 100%;animation:sk 1.3s ease-in-out infinite}
@keyframes sk{to{background-position:-200% 0}}

/* ================= TICKET ================= */
.ticket{position:relative;border-radius:var(--r);overflow:hidden;background:var(--card);border:1px solid var(--line);box-shadow:var(--sh)}
.tk-top{position:relative;padding:22px 20px 20px;color:#fff;background:var(--tkbg)}
html[data-brand=ac]{--tkbg:radial-gradient(120% 140% at 100% 0%,#FF8A5C 0%,#FF5B2E 38%,#C2361A 100%)}
html[data-brand=s360]{--tkbg:linear-gradient(135deg,#2B5FD9,#16348A)}
html[data-brand=isra]{--tkbg:radial-gradient(120% 140% at 100% 0%,#2C3657 0%,#1B2238 60%,#121729 100%)}
html[data-brand=s360] .tk-top::after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.07) 1px,transparent 1px);background-size:22px 22px;pointer-events:none}
.tk-ok{display:flex;align-items:center;gap:10px;font:700 12px var(--body);letter-spacing:.14em;text-transform:uppercase;opacity:.92}
.tk-ok i{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.2)}
.tk-date{font:700 clamp(28px,7.5vw,40px)/1.02 var(--disp);letter-spacing:-.03em;margin:14px 0 6px}
html[data-brand=isra] .tk-date{font-weight:500}
html[data-brand=isra] .tk-ok{color:var(--gold2)}
.tk-time{font:600 17px var(--body);opacity:.92;font-variant-numeric:tabular-nums}
.tk-cut{position:relative;height:0;border-top:2px dashed var(--line2);margin:0 18px}
.tk-cut::before,.tk-cut::after{content:"";position:absolute;top:-13px;width:24px;height:24px;border-radius:50%;background:var(--bg)}
.tk-cut::before{left:-31px}.tk-cut::after{right:-31px}
.tk-body{padding:18px 20px 20px}
.tk-rows{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 16px}
.tk-rows dt{font:700 10.5px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.tk-rows dd{font:600 14.5px/1.35 var(--body);margin-top:3px;overflow-wrap:anywhere}
.tk-rows .full{grid-column:1/-1}
.folio{font:700 15px var(--mono);letter-spacing:.12em}
.tk-host{display:flex;align-items:center;gap:10px}
.tk-host img,.tk-host .mono{width:30px;height:30px;border-radius:50%;object-fit:cover;flex:none;font-size:11px}
.tk-act{display:grid;gap:10px;margin-top:18px}
.next{margin-top:18px;display:grid;gap:0;counter-reset:n}
.next li{list-style:none;display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line);font-size:14px;line-height:1.4}
.next li::before{counter-increment:n;content:counter(n);width:26px;height:26px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--accSoft);color:var(--acc);font:700 12px var(--body)}
html[data-brand=isra] .next li::before{background:transparent;border:1px solid var(--gold2);color:var(--gold)}
html[data-brand=ac] .next li::before{color:#FF8A5C}
.next b{display:block;font-weight:700}
.next span{color:var(--mut);font-size:13px}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-10px;width:7px;height:12px;border-radius:2px;opacity:.9;animation:fall 1.8s cubic-bezier(.2,.6,.4,1) forwards}
@keyframes fall{to{transform:translateY(240px) rotate(540deg);opacity:0}}

/* ================= TRUST ================= */
.trust{padding:40px 0 30px}
.sec-h{margin-bottom:18px}
.sec-h h2{font-size:clamp(28px,7vw,44px);margin-top:8px}
.sec-h p{color:var(--mut);margin-top:8px;max-width:560px}
/* ac products */
.prods{display:grid;gap:12px}
.prod{display:flex;flex-direction:column;justify-content:space-between;gap:16px;min-height:0;padding:20px;border-radius:24px;border:1px solid var(--line);background:var(--card);text-decoration:none;position:relative;overflow:hidden;transition:transform .25s,border-color .25s}
.prod:hover{transform:translateY(-3px);border-color:rgba(255,91,46,.45)}
.prod .ic{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--accSoft);color:var(--acc)}
.prod b{display:block;font:700 19px var(--disp);letter-spacing:-.02em}
.prod p{color:var(--mut);font-size:13.5px;margin-top:4px}
.prod .go{position:absolute;right:18px;top:20px;color:var(--mut)}
.prod:not(.big){flex-direction:row;align-items:center;padding-right:44px}
.prod:not(.big) .go{top:50%;transform:translateY(-50%)}
.prod.big{background:radial-gradient(120% 120% at 100% 0%,rgba(255,91,46,.35),transparent 60%),var(--card)}
/* s360 work grid */
.work{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.work figure{position:relative;aspect-ratio:4/5;background:#1A2A52;overflow:hidden;border-radius:4px}
.work figure:nth-child(1),.work figure:nth-child(6){grid-column:1/-1;aspect-ratio:16/10}
.work img{width:100%;height:100%;object-fit:cover;transition:transform 1s}
.work figure:hover img{transform:scale(1.05)}
.work figcaption{position:absolute;inset:auto 0 0 0;padding:28px 12px 11px;background:linear-gradient(180deg,transparent,rgba(10,18,40,.85));color:#fff}
.work figcaption b{display:block;font:750 17px var(--disp);font-stretch:88%;letter-spacing:-.01em}
.work figcaption span{font:500 10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;opacity:.8}
.stages{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media(max-width:820px){.stages{grid-template-columns:1fr}}
.stg{background:var(--card);border:1px solid var(--line);border-radius:6px;overflow:hidden;min-width:0;display:flex;flex-direction:column}
.stg figure{position:relative;aspect-ratio:16/10;background:#1A2A52;overflow:hidden;margin:0}
.stg img{width:100%;height:100%;object-fit:cover;transition:transform 1s}
.stg:hover img{transform:scale(1.04)}
.stg .st{position:absolute;left:10px;top:10px;font:650 10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:#fff;background:rgba(14,26,51,.66);backdrop-filter:blur(6px);padding:6px 9px;border-radius:3px}
.stg .bd{padding:14px 14px 16px;display:grid;gap:8px}
.stg .bd b{font:750 17px var(--disp);font-stretch:88%;letter-spacing:-.01em;text-wrap:balance}
.stg .bd small{font:500 11px var(--mono);color:var(--mut);letter-spacing:.04em}
.stg .prog{height:6px;border-radius:99px;background:color-mix(in srgb,var(--acc) 14%,transparent);overflow:hidden}
.stg .prog i{display:block;height:6px;border-radius:inherit;background:var(--acc)}
.stg ul{list-style:none;margin:2px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.stg li{display:inline-flex;align-items:center;gap:5px;font:600 12px var(--body,inherit);padding:5px 9px;border-radius:99px;border:1px solid var(--line);color:var(--mut)}
.stg li i{width:7px;height:7px;border-radius:50%;border:1.5px solid currentColor}
.stg li.s2{color:var(--acc);border-color:color-mix(in srgb,var(--acc) 35%,transparent)}
.stg li.s1{color:var(--ink,#0E1222);border-color:var(--acc);background:color-mix(in srgb,var(--acc) 10%,transparent)}
.stg li.s1 i{background:var(--acc);border-color:var(--acc);animation:pul 1.6s infinite}
@keyframes pul{50%{opacity:.35}}
.priv{display:flex;gap:10px;align-items:flex-start;margin:12px 0 6px;padding:13px 14px;border:1px dashed color-mix(in srgb,var(--acc) 45%,transparent);border-radius:6px;font-size:14px;color:var(--mut)}
.priv svg{flex:none;color:var(--acc);margin-top:1px}
.priv b{color:var(--ink,#0E1222)}
.team{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:6px}
.team div{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:12px}
.team b{display:block;font:700 15px var(--disp);font-stretch:90%}
.team span{font:500 11px var(--mono);color:var(--mut);letter-spacing:.04em}
/* isra bio */
.bio{display:grid;gap:18px}
.bio-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.bio-card p{font-size:16px;line-height:1.6;color:var(--ink)}
.bio-card p+p{margin-top:10px;color:var(--mut);font-size:15px}
.tl{display:grid;gap:0;margin-top:6px}
.tl>div{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;padding:13px 0;border-top:1px solid var(--line);align-items:baseline}
.tl span{font:500 13px var(--body);color:var(--gold);font-variant-numeric:tabular-nums}
.tl b{font:500 18px var(--disp)}
.tl small{display:block;color:var(--mut);font-size:13px}
.soc{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}

/* ================= FOOTER ================= */
.foot{padding:30px 0 calc(40px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);margin-top:10px}
.foot h3{font:700 12px var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--mut);margin-bottom:12px}
.agendas{display:grid;gap:10px}
.ag{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--r2);border:1px solid var(--line);background:var(--card);text-decoration:none;transition:transform .2s,border-color .2s;min-width:0}
.ag:hover{transform:translateY(-2px);border-color:var(--line2)}
.ag img,.ag .mono{width:40px;height:40px;border-radius:12px;object-fit:cover;flex:none;font-size:13px}
.ag .tx{min-width:0;flex:1}
.ag b{display:block;font:700 15px var(--disp)}
.ag .wai{width:40px;height:40px;border-radius:12px;display:grid!important;place-items:center;background:#1FAF5A;color:#fff;flex:none}
.ag span.mono{display:inline-grid;font-size:11px;color:var(--accInk)}
.ag span{display:block;color:var(--mut);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fb{display:flex;flex-wrap:wrap;justify-content:space-between;gap:14px;align-items:center;margin-top:22px;font-size:13px;color:var(--mut)}
.fb a{text-decoration:none}
.fb a:hover{color:var(--ink)}

/* ================= ERROR / LOADING PAGE ================= */
.fatal{padding:34px 20px;text-align:center}
.fatal b{display:block;font:700 20px var(--disp);margin:10px 0 6px}
.fatal p{color:var(--mut);margin-bottom:16px}
.fatal .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

/* ================= RESPONSIVE ================= */
@media (min-width:560px){
  .prod{min-height:170px}
  .prod:not(.big){flex-direction:column;align-items:stretch}
  .prod:not(.big) .go{top:20px;transform:none}
  .svcs{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tk-act{grid-template-columns:repeat(2,minmax(0,1fr))}
  .agendas{grid-template-columns:repeat(3,minmax(0,1fr))}
  .prods{grid-template-columns:repeat(2,minmax(0,1fr))}
  .work{grid-template-columns:repeat(3,minmax(0,1fr))}
  .work figure:nth-child(6){grid-column:auto;aspect-ratio:4/5}
  .work figure:nth-child(1){grid-column:span 2;grid-row:span 2;aspect-ratio:auto}
  .demo{flex-basis:160px}
}
@media (min-width:900px){
  .ac-grid{grid-template-columns:minmax(0,1.25fr) minmax(0,.9fr);gap:56px}
  html[data-brand=ac] .hero{padding:80px 0 40px}
  .bk-grid{grid-template-columns:minmax(0,1fr) 320px}
  .sum{display:block}

function icsEsc(s){return String(s||'').replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;')}
function icsDate(t){var d=new Date(t);return d.getUTCFullYear()+pad(d.getUTCMonth()+1)+pad(d.getUTCDate())+'T'+pad(d.getUTCHours())+pad(d.getUTCMinutes())+'00Z'}
function done(st){
  var r=S.res,t0=Date.parse(r.inicio)||S.slot.t,t1=Date.parse(r.fin)||(t0+S.svc.duracion_min*60000),folio=String(r.id).replace(/-/g,'').slice(0,8).toUpperCase();
  var svc=r.servicio||S.svc.nombre,day=cap(fDayLong(t0)),time=fTime(t0)+' – '+fTime(t1);
  var ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Agendo//'+SLUG+'//ES','CALSCALE:GREGORIAN','METHOD:PUBLISH','BEGIN:VEVENT','UID:'+r.id+'@agendo','DTSTAMP:'+icsDate(Date.now()),'DTSTART:'+icsDate(t0),'DTEND:'+icsDate(t1),
    'SUMMARY:'+icsEsc(svc+' · '+bizName()),'DESCRIPTION:'+icsEsc('Folio '+folio+'\nConfirmación por WhatsApp: https://wa.me/'+wa()),'URL:'+icsEsc(location.href.split('#')[0]),
    'BEGIN:VALARM','TRIGGER:-PT1H','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(svc),'END:VALARM','END:VEVENT','END:VCALENDAR'].join('\r\n');
  var url='#';try{url=URL.createObjectURL(new Blob([ics],{type:'text/calendar;charset=utf-8'}))}catch(e){}
  var first=S.form.nombre.split(/\s+/)[0];
  var msg=C.waHello+', soy '+S.form.nombre+'. Confirmo mi cita de '+svc+' el '+fDayLong(t0)+' a las '+fTime(t0)+' (folio '+folio+').';
  var cols=THEME==='ac'?['#FF5B2E','#FFB36B','#fff','#FF8A5C']:THEME==='s360'?['#2B5FD9','#9DB6F5','#fff','#0E1A33']:['#D9BC83','#B8955A','#fff','#F1DDB0'];
  var conf='';for(var i=0;i<26;i++){conf+='<i style="left:'+(Math.random()*100).toFixed(1)+'%;background:'+cols[i%cols.length]+';animation-delay:'+(Math.random()*.5).toFixed(2)+'s;transform:rotate('+(Math.random()*180|0)+'deg)"></i>'}
  st.innerHTML='<div class="fade tk-wrap" style="margin:0 auto">'+
    '<div class="ticket"><div class="tk-top"><div class="confetti" aria-hidden="true">'+conf+'</div><div class="tk-ok"><i>'+ic('check','s16')+'</i>Cita confirmada</div>'+
    '<div class="tk-date">'+esc(day)+'</div><div class="tk-time">'+esc(time)+' · hora CDMX</div></div>'+
    '<div class="tk-cut"></div><div class="tk-body"><dl class="tk-rows">'+
    '<div class="full"><dt>'+(THEME==='isra'?'Tema':'Servicio')+'</dt><dd>'+esc(svc)+'</dd></div>'+
    '<div><dt>Con</dt><dd class="tk-host">'+img(C.logo,'','',C.mono)+'<span>'+esc(C.host)+'</span></dd></div>'+
    '<div><dt>Folio</dt><dd class="folio">'+esc(folio)+'</dd></div>'+
    '<div><dt>A nombre de</dt><dd>'+esc(S.form.nombre)+'</dd></div>'+
    '<div><dt>WhatsApp</dt><dd class="tab">'+esc(S.form.tel)+'</dd></div>'+
    '</dl><div class="tk-act"><a class="btn btn-wa" id="waBtn" target="_blank" rel="noopener" href="https://wa.me/'+wa()+'?text='+encodeURIComponent(msg)+'">'+ic('wa','s18')+'Confirmar por WhatsApp</a>'+
    '<a class="btn btn-ghost" id="icsBtn" href="'+url+'" download="cita-'+folio.toLowerCase()+'.ics">'+ic('cal','s18')+'Agregar a mi calendario</a></div></div></div>'+
    '<div style="margin-top:22px"><div class="st-t">'+(THEME==='isra'?'Gracias, '+esc(first)+'. Esto sigue:':'¿Qué sigue, '+esc(first)+'?')+'</div>'+
    '<ol class="next">'+C.next.map(function(n){return '<li><div><b>'+esc(n[0])+'</b><span>'+esc(n[1])+'</span></div></li>'}).join('')+'</ol>'+
    '<div style="display:flex;justify-content:center;margin-top:10px"><button type="button" class="lnk" id="again">'+ic('refresh','s16')+'Agendar otra cita</button></div></div></div>';
  document.getElementById('again').onclick=function(){S.svc=null;S.slot=null;S.res=null;S.brief={};S.form.nota='';loadBusy().catch(function(){}).then(function(){renderNextFree();go(1)})};
  document.getElementById('sum').style.display='none';
}
