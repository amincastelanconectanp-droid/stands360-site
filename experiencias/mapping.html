<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive">
<title>Video mapping · demo</title>
<style>
html,body{margin:0;height:100%;background:#05070d;color:#eef2fc;font-family:Inter,Arial,sans-serif;overflow:hidden}
#c{position:fixed;inset:0}
.ui{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:flex;gap:8px;flex-wrap:wrap;justify-content:center;z-index:5;max-width:94vw}
.ui button{background:rgba(12,20,42,.85);color:#fff;border:1px solid #2a3a6a;border-radius:99px;padding:10px 16px;font:600 14px Inter,Arial,sans-serif;cursor:pointer}
.ui button.on{background:#4f7dff;border-color:#4f7dff}
.hd{position:fixed;left:20px;top:16px;z-index:5;max-width:420px}
.hd b{font-size:12px;letter-spacing:.2em;color:#8fb0ff}.hd h1{margin:6px 0 4px;font-size:22px}.hd p{margin:0;color:#a3afcf;font-size:13px}
#flat{position:fixed;inset:0;display:none;z-index:4;background:#000;align-items:center;justify-content:center}
#flat canvas{max-width:100%;max-height:100%}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script></head><body>
<div class="hd"><b>STANDS 360 · DEMO</b><h1>Video mapping sobre el stand</h1><p>Así se ve una animación proyectada que sigue las formas del stand. Arrastra para girar la vista.</p></div>
<canvas id="c"></canvas>
<div id="flat"></div>
<div class="ui"><button data-s="0" class="on">1 · Se dibuja el stand</button><button data-s="1">2 · Partículas a logo</button><button data-s="2">3 · Ola de luz</button><button id="fl">Ver lo que sale del proyector</button></div>
<script>
// textura animada (lo que sale del proyector): 2048 x 1024 = fachada 6 x 3 m
const TX=document.createElement('canvas');TX.width=2048;TX.height=1024;const g=TX.getContext('2d');
let S=0,t0=performance.now();
const P=[];for(let i=0;i<1400;i++)P.push({x:Math.random()*2048,y:Math.random()*1024,tx:0,ty:0});
// destinos de las particulas: texto TU MARCA
(function(){const o=document.createElement('canvas');o.width=2048;o.height=1024;const q=o.getContext('2d');q.fillStyle='#fff';q.font='800 260px Arial';q.textAlign='center';q.textBaseline='middle';q.fillText('TU MARCA',1024,470);q.font='600 90px Arial';q.fillText('en la expo',1024,700);
const d=q.getImageData(0,0,2048,1024).data,pts=[];for(let y=0;y<1024;y+=9)for(let x=0;x<2048;x+=9)if(d[(y*2048+x)*4]>128)pts.push([x,y]);P.forEach((p,i)=>{const k=pts[i%pts.length];p.tx=k[0];p.ty=k[1];});})();
// paneles de la fachada (x0,y0,x1,y1 en px de la textura) para el modo 1
const PAN=[[60,60,620,964],[700,60,1348,560],[700,620,1348,964],[1428,60,1988,964]];
function draw(){const t=(performance.now()-t0)/1000;g.globalCompositeOperation='source-over';g.fillStyle='rgba(0,0,0,'+(S==1?.25:1)+')';g.fillRect(0,0,2048,1024);
if(S==0){const L=t*900;g.lineWidth=10;g.strokeStyle='#8fb0ff';g.shadowColor='#4f7dff';g.shadowBlur=30;let acc=0;
 PAN.forEach((r,i)=>{const per=2*((r[2]-r[0])+(r[3]-r[1]));const e=Math.max(0,Math.min(per,L-acc));acc+=per*0.6;g.beginPath();let rem=e;const pts=[[r[0],r[1]],[r[2],r[1]],[r[2],r[3]],[r[0],r[3]],[r[0],r[1]]];g.moveTo(...pts[0]);for(let k=1;k<5&&rem>0;k++){const a=pts[k-1],b=pts[k],len=Math.hypot(b[0]-a[0],b[1]-a[1]);const f=Math.min(1,rem/len);g.lineTo(a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f);rem-=len;}g.stroke();
 const fill=Math.max(0,Math.min(1,(t-3-i*.4)/1.2));if(fill>0){const gr=g.createLinearGradient(r[0],r[3],r[0],r[1]);gr.addColorStop(0,'rgba(79,125,255,'+.55*fill+')');gr.addColorStop(1,'rgba(201,164,90,'+.35*fill+')');g.fillStyle=gr;g.fillRect(r[0],r[3]-(r[3]-r[1])*fill,r[2]-r[0],(r[3]-r[1])*fill);}});
 g.shadowBlur=0;if(t>6.5){g.fillStyle='rgba(255,255,255,'+Math.min(1,(t-6.5))+')';g.font='800 120px Arial';g.textAlign='center';g.fillText('TU MARCA',1024,330);}if(t>10)t0=performance.now();}
if(S==1){const k=Math.min(1,t/3.5),e=1-Math.pow(1-k,3);g.fillStyle='#ffd27a';P.forEach((p,i)=>{const w=Math.sin(t*2+i)*6*(1-e);const x=p.x+(p.tx-p.x)*e+w,y=p.y+(p.ty-p.y)*e+w;g.fillRect(x,y,6,6);});if(t>7){P.forEach(p=>{p.x=Math.random()*2048;p.y=Math.random()*1024;});t0=performance.now();}}
if(S==2){for(let i=0;i<14;i++){const x=((t*500+i*160)%2400)-200;const gr=g.createLinearGradient(x-120,0,x+120,0);gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(.5,i%2?'rgba(79,125,255,.85)':'rgba(201,164,90,.85)');gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.fillRect(x-120,0,240,1024);}
 g.globalCompositeOperation='destination-in';g.fillStyle='#fff';g.beginPath();PAN.forEach(r=>g.rect(r[0],r[1],r[2]-r[0],r[3]-r[1]));g.fill();g.globalCompositeOperation='destination-over';g.fillStyle='#000';g.fillRect(0,0,2048,1024);g.globalCompositeOperation='source-over';
 g.strokeStyle='rgba(255,255,255,.7)';g.lineWidth=4;PAN.forEach(r=>g.strokeRect(r[0],r[1],r[2]-r[0],r[3]-r[1]));}
}
// escena 3D
const R=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,1.5));
const SC=new THREE.Scene();SC.background=new THREE.Color(0x05070d);SC.fog=new THREE.Fog(0x05070d,14,30);
const CAM=new THREE.PerspectiveCamera(50,1,.1,100);
const tex=new THREE.CanvasTexture(TX);tex.encoding=THREE.sRGBEncoding;R.outputEncoding=THREE.sRGBEncoding;
SC.add(new THREE.HemisphereLight(0x8899cc,0x111111,.35));
const floor=new THREE.Mesh(new THREE.PlaneGeometry(40,40),new THREE.MeshStandardMaterial({color:0x1a1d24,roughness:.9}));floor.rotation.x=-Math.PI/2;SC.add(floor);
const fac=new THREE.Mesh(new THREE.BoxGeometry(6,3,.25),[new THREE.MeshStandardMaterial({color:0x2a2e36}),new THREE.MeshStandardMaterial({color:0x2a2e36}),new THREE.MeshStandardMaterial({color:0x2a2e36}),new THREE.MeshStandardMaterial({color:0x2a2e36}),new THREE.MeshBasicMaterial({map:tex}),new THREE.MeshStandardMaterial({color:0x2a2e36})]);fac.position.set(0,1.6,0);SC.add(fac);
const base=new THREE.Mesh(new THREE.BoxGeometry(6.4,.1,3),new THREE.MeshStandardMaterial({color:0x30343c}));base.position.set(0,.05,1.2);SC.add(base);
for(const x of [-2.2,2.2]){const p=new THREE.Mesh(new THREE.BoxGeometry(.6,1,.6),new THREE.MeshStandardMaterial({color:0x111318}));p.position.set(x,.6,1.6);SC.add(p);}
// proyector y haz
const pj=new THREE.Mesh(new THREE.BoxGeometry(.5,.25,.5),new THREE.MeshStandardMaterial({color:0x222}));pj.position.set(0,4.2,7);SC.add(pj);
const spill=new THREE.PointLight(0x6f8fff,.6,10);spill.position.set(0,1.6,1.5);SC.add(spill);
// orbita simple
let az=-.35,el=.18,dist=10,drag=null;const tgt=new THREE.Vector3(0,1.5,0);
function place(){CAM.position.set(tgt.x+dist*Math.sin(az)*Math.cos(el),tgt.y+dist*Math.sin(el),tgt.z+dist*Math.cos(az)*Math.cos(el));CAM.lookAt(tgt);}
addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;drag=[e.clientX,e.clientY,az,el];});addEventListener('pointerup',()=>drag=null);
addEventListener('pointermove',e=>{if(!drag)return;az=drag[2]-(e.clientX-drag[0])*.005;el=Math.max(.02,Math.min(.9,drag[3]+(e.clientY-drag[1])*.004));});
addEventListener('wheel',e=>{dist=Math.max(6,Math.min(16,dist+e.deltaY*.01));},{passive:true});
function rs(){R.setSize(innerWidth,innerHeight,false);CAM.aspect=innerWidth/innerHeight;CAM.updateProjectionMatrix();}addEventListener('resize',rs);rs();
// vista plana
const flat=document.getElementById('flat');let isFlat=false;
document.getElementById('fl').onclick=()=>{isFlat=!isFlat;flat.style.display=isFlat?'flex':'none';if(isFlat)flat.appendChild(TX);document.getElementById('fl').textContent=isFlat?'Ver sobre el stand':'Ver lo que sale del proyector';};
document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{S=+b.dataset.s;t0=performance.now();document.querySelectorAll('[data-s]').forEach(x=>x.classList.toggle('on',x===b));});
let auto=0;(function loop(){draw();tex.needsUpdate=true;if(!drag)az+=.0006*Math.sin(auto+=.01);place();R.render(SC,CAM);requestAnimationFrame(loop);})();
</script></body></html>
