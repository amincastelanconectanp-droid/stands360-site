<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Presentación del proyecto · STANDS 360</title>
<style>
:root{--bg:#0a0f1e;--surface:#121a30;--surface2:#18223f;--line:#243257;--fg:#e8ecf8;--muted:#9aa7c9;--accent:#2f6bff;--accent-fg:#fff;--ok:#2fbf8a;--warn:#f0a93b;color-scheme:dark}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f3f5fb;--surface:#fff;--surface2:#eef2fb;--line:#d8dfef;--fg:#0f1830;--muted:#58658a;--accent:#2457d6;--ok:#13805b;--warn:#a86a07;color-scheme:light}}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif}
.app{height:100dvh;display:flex;flex-direction:column;padding-inline:16px;padding-block:calc(10px + env(safe-area-inset-top,0px)) calc(10px + env(safe-area-inset-bottom,0px))}
.msg{margin:auto;max-width:460px;text-align:center;color:var(--muted)}.msg h1{color:var(--fg)}
.brand{font-weight:700;font-size:20px;letter-spacing:-.01em}.brand b{color:var(--accent)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-bottom:8px}
.bar .nm{color:var(--muted);font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.tools{display:flex;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--accent);color:var(--accent-fg);text-decoration:none;font:inherit;font-weight:600;border:0;border-radius:12px;padding:10px 16px;cursor:pointer}
.btn.sm{padding:8px 12px;font-size:14px}.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}.btn[disabled]{opacity:.7;cursor:default}
.prog{height:4px;background:var(--surface2);border-radius:99px;overflow:hidden}.prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.stage{flex:1;min-height:0;position:relative;margin-block:10px}
.slide{position:absolute;inset:0;display:none;overflow:auto;border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:clamp(16px,3vw,36px)}
.slide.on{display:flex}
.cover{flex-direction:column;justify-content:center;gap:14px}.cover h1{font-size:clamp(30px,6vw,60px);line-height:1.08;margin:0;letter-spacing:-.025em;text-wrap:balance}
.eyebrow{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin:0;font-weight:700}.sub{font-size:clamp(18px,2.5vw,26px);color:var(--muted);margin:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}.chip{background:var(--surface2);border:1px solid var(--line);border-radius:99px;padding:5px 12px;font-size:13px;color:var(--muted)}.chip b{color:var(--fg);font-weight:600}
.hint{color:var(--muted);font-size:14px;margin:0}
.item{gap:clamp(16px,3vw,32px);flex-direction:column}
@media (min-width:860px){.item{flex-direction:row;align-items:stretch}.item .media{flex:1.6}.item .info{flex:1;max-width:420px}}
.media{margin:0;min-height:220px;background:var(--bg);border:1px solid var(--line);border-radius:14px;display:flex;align-items:center;justify-content:center;overflow:hidden;min-width:0}
.media a{display:flex;width:100%;height:100%;align-items:center;justify-content:center}
.media img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.media .ph{color:var(--muted);padding:24px;text-align:center}
.info{display:flex;flex-direction:column;gap:10px;min-width:0}.info h2{margin:0;font-size:clamp(22px,3vw,32px);line-height:1.15;overflow-wrap:anywhere;text-wrap:balance}
.tag{align-self:flex-start;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:3px 10px}
.desc{color:var(--muted);overflow-wrap:anywhere}.ok{color:var(--ok);font-weight:700;font-size:13px;letter-spacing:.05em;text-transform:uppercase}
.slide.is-ok{border-color:var(--ok)}
.xa{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}.xc{display:flex;flex-direction:column;gap:8px}.xc[hidden]{display:none}
.xc textarea{width:100%;background:var(--surface2);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;resize:vertical}
.xmsg:empty{display:none}.xmsg{color:var(--warn);margin:0;font-size:14px}
.end{flex-direction:column;justify-content:center;gap:14px}.end h2{font-size:clamp(24px,4vw,40px);margin:0;line-height:1.15}.end ul{margin:0;padding-left:20px;color:var(--muted)}
.end .acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.nav{display:flex;align-items:center;justify-content:space-between;gap:12px}.nav .ct{color:var(--muted);font-variant-numeric:tabular-nums;font-size:14px}
.toast{position:fixed;left:16px;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));max-width:420px;margin:0 auto;background:var(--ok);color:#fff;padding:12px 16px;border-radius:12px;font-weight:600;text-align:center;z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.35)}
@media print{
  :root{--bg:#fff;--surface:#fff;--surface2:#f3f5fb;--line:#d8dfef;--fg:#0f1830;--muted:#58658a;--accent:#2457d6;--ok:#13805b;color-scheme:light}
  html,body,.app{height:auto}.app{display:block;padding:0}
  .bar,.nav,.prog,.xa,.xc,.xmsg,.toast,.hint.kb{display:none!important}
  .stage{position:static;margin:0}
  .slide{position:static;display:flex!important;break-after:page;page-break-after:always;min-height:96vh;border:0;border-radius:0;overflow:visible}
  .item{flex-direction:row}.item .media{flex:1.6}.item .info{flex:1}
}
</style></head>
<body><div class="app" id="app"><p class="msg">Cargando presentación…</p></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/portal/shared.js"></script>
<script>
(function(){
  var S=S360,sb=S.sb,esc=S.esc,app=document.getElementById("app");
  var TIPO={diseno_rapido:"Propuesta de diseño",presentacion:"Presentación",imagen:"Diseño",plano:"Planos",avance:"Avance de fabricación",otro:"Documento"};
  var RANK={diseno_rapido:1,presentacion:2,imagen:3,plano:4,avance:5,otro:6};
  var P=null,E=[],U={},rol=null,can=false,cur=0,total=0,slides=[];
  function msg(h,p,l){app.innerHTML='<div class="msg"><div class="brand">stands<b>360</b></div><h1>'+esc(h)+'</h1><p>'+esc(p)+'</p>'+(l?'<a class="btn" href="'+esc(l[0])+'">'+esc(l[1])+'</a>':'')+'</div>'}
  function toast(t){var d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(function(){d.remove()},4500)}
  function chips(){var a=[["Expo",P.expo],["Recinto",P.recinto],["Stand",P.m2?P.m2+" m²":""],["Montaje",P.montaje_texto],["Evento",P.evento_texto]].filter(function(x){return x[1]});return a.map(function(x){return '<span class="chip">'+x[0]+' <b>'+esc(x[1])+'</b></span>'}).join("")}
  function slideItem(x){
    var url=U[x.storage_path],img=url&&(x.mime||"").indexOf("image/")===0,dis=x.tipo==="diseno_rapido",apr=dis||x.tipo==="presentacion"||x.tipo==="plano",ok=!!x.aprobado_cliente;
    var media=img?'<a href="'+esc(url)+'" target="_blank" rel="noopener" title="Abrir en tamaño completo"><img src="'+esc(url)+'" alt="'+esc(x.titulo)+'"></a>':url?'<div class="ph"><a class="btn ghost" href="'+esc(url)+'" target="_blank" rel="noopener">Abrir archivo</a></div>':'<div class="ph">Imagen en preparación</div>';
    var lab=dis?(ok?"✓ Diseño elegido":"Elegir este diseño"):(ok?"✓ Aprobado":"Aprobar");
    var acts=can&&apr?'<div class="xa"><button class="btn" data-xa="aprobar" data-id="'+esc(x.id)+'"'+(ok?" disabled":"")+'>'+lab+'</button><button class="btn ghost" data-xa="cambios" data-id="'+esc(x.id)+'">Pedir cambios</button></div><div class="xc" id="xc-'+esc(x.id)+'" hidden><textarea rows="3" maxlength="800" placeholder="Cuéntanos qué te gustaría cambiar…"></textarea><button class="btn sm" data-xs="'+esc(x.id)+'">Enviar comentarios</button></div><p class="xmsg" id="xm-'+esc(x.id)+'"></p>':"";
    return '<section class="slide item'+(ok?" is-ok":"")+'"><figure class="media">'+media+'</figure><div class="info"><span class="tag">'+esc(TIPO[x.tipo]||"Documento")+'</span><h2>'+esc(x.titulo)+'</h2>'+(x.descripcion?'<div class="desc">'+esc(x.descripcion).replace(/\n/g,"<br>")+'</div>':"")+(ok?'<span class="ok">'+(dis?"Tu elección":"Aprobado por ti")+'</span>':"")+acts+'</div></section>'
  }
  function render(){
    var first=(P.cliente_contacto||"").split(" ")[0];
    var chosen=E.filter(function(x){return x.aprobado_cliente});
    var h=[];
    h.push('<section class="slide cover"><div class="brand">stands<b>360</b></div><p class="eyebrow">Presentación de proyecto</p><h1>'+esc(P.nombre)+'</h1><p class="sub">'+esc(P.cliente_empresa||"")+(first?" · Para "+esc(first):"")+'</p><div class="chips">'+chips()+'</div><p class="hint kb">Usa las flechas del teclado o desliza para avanzar.</p></section>');
    E.forEach(function(x){h.push(slideItem(x))});
    h.push('<section class="slide end"><p class="eyebrow">Siguientes pasos</p><h2>'+(chosen.length?"Gracias por tu aprobación":"¿Qué te pareció?")+'</h2>'+(chosen.length?'<ul>'+chosen.map(function(x){return '<li>'+esc(x.titulo)+'</li>'}).join("")+'</ul>':"")+'<ul><li>Tus elecciones y comentarios llegan directo a nuestro equipo.</li><li>Cuando todo esté aprobado pasamos a la siguiente fase de tu proyecto.</li><li>Puedes volver a esta presentación cuando quieras desde tu portal.</li></ul><div class="acts"><a class="btn" href="'+esc(S.wa(null,"Hola, vi la presentación de mi proyecto "+P.nombre+" y tengo comentarios."))+'" rel="noopener">Escribir por WhatsApp</a><a class="btn ghost" href="/portal/#'+esc(P.id)+'">Volver a mi portal</a></div></section>');
    slides=h;total=h.length;
    app.innerHTML='<div class="bar"><div class="brand">stands<b>360</b></div><div class="nm">'+esc(P.nombre)+(can?"":" · vista del equipo")+'</div><div class="tools"><button class="btn ghost sm" id="fs" type="button">Pantalla completa</button><button class="btn ghost sm" id="pdf" type="button">Guardar PDF</button></div></div><div class="prog"><i id="pg"></i></div><div class="stage" id="stage">'+h.join("")+'</div><div class="nav"><button class="btn ghost" id="pv" type="button">← Anterior</button><span class="ct" id="ct" aria-live="polite"></span><button class="btn" id="nx" type="button">Siguiente →</button></div>';
    wire();show(Math.min(cur,total-1))
  }
  function show(n){
    cur=Math.max(0,Math.min(total-1,n));
    var els=app.querySelectorAll(".slide");els.forEach(function(el,i){el.classList.toggle("on",i===cur)});
    document.getElementById("ct").textContent=(cur+1)+" / "+total;
    document.getElementById("pg").style.width=((cur+1)/total*100)+"%";
    document.getElementById("pv").disabled=cur===0;document.getElementById("nx").disabled=cur===total-1;
    try{history.replaceState(null,"","#"+(cur+1))}catch(e){}
  }
  async function act(id,acc,com,btn){
    var m=document.getElementById("xm-"+id);btn.disabled=true;if(m)m.textContent="Enviando…";
    try{
      var r=await sb.rpc("cliente_responder_entregable",{eid:id,accion:acc,comentario:com||null});
      if(r.error){if(m)m.textContent=r.error.message||"No se pudo enviar. Inténtalo de nuevo.";btn.disabled=false;return}
      await load();render();toast(acc==="aprobar"?"¡Listo! Ya avisamos al equipo.":"Recibimos tus comentarios. Los revisamos y te respondemos pronto.")
    }catch(e){if(m)m.textContent="No hay conexión. Inténtalo de nuevo.";btn.disabled=false}
  }
  function wire(){
    document.getElementById("pv").onclick=function(){show(cur-1)};
    document.getElementById("nx").onclick=function(){show(cur+1)};
    document.getElementById("pdf").onclick=function(){window.print()};
    document.getElementById("fs").onclick=function(){
      try{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen()}catch(e){}
    };
    app.querySelectorAll("[data-xa]").forEach(function(b){b.onclick=function(){
      var id=b.dataset.id;
      if(b.dataset.xa==="cambios"){var bx=document.getElementById("xc-"+id);if(bx){bx.hidden=!bx.hidden;if(!bx.hidden)bx.querySelector("textarea").focus()}return}
      act(id,"aprobar","",b)}});
    app.querySelectorAll("[data-xs]").forEach(function(b){b.onclick=function(){var id=b.dataset.xs;act(id,"cambios",document.querySelector("#xc-"+id+" textarea").value,b)}})
  }
  document.addEventListener("keydown",function(e){
    if(!total||/^(TEXTAREA|INPUT|SELECT)$/.test((e.target||{}).tagName))return;
    if(e.key==="ArrowRight"||e.key==="PageDown"||e.key===" "){e.preventDefault();show(cur+1)}
    else if(e.key==="ArrowLeft"||e.key==="PageUp"){e.preventDefault();show(cur-1)}
    else if(e.key==="Home")show(0);else if(e.key==="End")show(total-1)
  });
  var tx=0,ty=0;
  document.addEventListener("touchstart",function(e){tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
  document.addEventListener("touchend",function(e){
    if(!total||/^(TEXTAREA|INPUT|BUTTON|A)$/.test((e.target||{}).tagName))return;
    var dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
    if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5)show(cur+(dx<0?1:-1))
  },{passive:true});
  async function load(){
    var en=await sb.from("entregables").select("id,tipo,titulo,descripcion,storage_path,mime,aprobado_cliente,created_at").eq("proyecto_id",P.id).eq("estado","aprobado").eq("visible_cliente",true).order("created_at",{ascending:true});
    E=(en.data||[]).slice().sort(function(a,b){return (RANK[a.tipo]||9)-(RANK[b.tipo]||9)||String(a.created_at).localeCompare(String(b.created_at))});
    U={};var paths=E.map(function(x){return x.storage_path}).filter(Boolean);
    if(paths.length){try{var sg=await sb.storage.from("archivos").createSignedUrls(paths,3600);(sg.data||[]).forEach(function(x){if(x.signedUrl)U[x.path]=x.signedUrl})}catch(e){}}
  }
  (async function(){
    try{
      var ss=await sb.auth.getSession();
      if(!ss.data.session)return msg("Entra a tu portal","Para ver la presentación primero escribe tu código de acceso en el portal de clientes.",["/portal/","Ir al portal"]);
      var pid=new URLSearchParams(location.search).get("p"),q=sb.from("proyectos").select("id,nombre,cliente_empresa,cliente_contacto,expo,recinto,m2,montaje_texto,evento_texto");
      q=pid&&/^[0-9a-f-]{36}$/i.test(pid)?q.eq("id",pid):q.order("created_at",{ascending:false});
      var r=await Promise.all([q.limit(1).maybeSingle(),sb.from("profiles").select("rol").eq("id",ss.data.session.user.id).maybeSingle()]);
      P=r[0].data;rol=r[1].data&&r[1].data.rol;can=!rol||rol==="cliente";
      if(!P)return msg("No encontramos el proyecto","Revisa que entraste con el código correcto o escríbenos por WhatsApp.",["/portal/","Ir al portal"]);
      await load();
      if(!E.length)return msg("Tu presentación está en preparación","En cuanto el equipo publique los diseños aprobados, los verás aquí.",["/portal/#"+P.id,"Volver a mi portal"]);
      var h=parseInt((location.hash||"").slice(1),10);if(h>0)cur=h-1;
      render()
    }catch(e){msg("No pudimos cargar la presentación","Inténtalo de nuevo en un momento.",["/portal/","Ir al portal"])}
  })()
})();
</script></body></html>
